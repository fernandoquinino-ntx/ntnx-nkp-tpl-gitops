name: Validate GitOps Manifests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Overlay
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cluster: [reference]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kustomize
        uses: sigstore/kustomize-installer@v1.0.3
        with:
          kustomize-version: '5.4.0'

      - name: Validate overlay builds (mgmt + managed-*)
        run: |
          CLUSTER="${{ matrix.cluster }}"
          ERRORS=0

          # Check mgmt/
          if [[ -d "overlay/clusters/$CLUSTER/mgmt" ]]; then
            echo "==> kustomize build overlay/clusters/$CLUSTER/mgmt"
            kustomize build --load-restrictor=LoadRestrictionsNone \
              overlay/clusters/$CLUSTER/mgmt > /dev/null 2>&1 || { echo "FAIL: mgmt/ build"; ERRORS=$((ERRORS+1)); }
          fi

          # Check managed-*/
          for dir in overlay/clusters/$CLUSTER/managed-*/; do
            [[ -d "$dir" ]] || continue
            echo "==> kustomize build $dir"
            kustomize build --load-restrictor=LoadRestrictionsNone "$dir" > /dev/null 2>&1 || { echo "FAIL: $(basename $dir)/ build"; ERRORS=$((ERRORS+1)); }
          done

          if [[ $ERRORS -gt 0 ]]; then
            exit 1
          fi
          echo "OK: all overlay builds passed"

      - name: Check for undeclared variables
        run: |
          CLUSTER="${{ matrix.cluster }}"
          VARS_FILE="overlay/clusters/$CLUSTER/cluster-vars.yaml"
          ENV_EXAMPLE="overlay/clusters/$CLUSTER/.env.example"

          if [[ ! -f "$VARS_FILE" ]] || [[ ! -f "$ENV_EXAMPLE" ]]; then
            echo "FAIL: cluster-vars.yaml or .env.example not found"
            exit 1
          fi

          ERRORS=0
          for dir in overlay/clusters/$CLUSTER/mgmt overlay/clusters/$CLUSTER/managed-*/; do
            [[ -d "$dir" ]] || continue
            BUILD="$(mktemp)"
            kustomize build --load-restrictor=LoadRestrictionsNone "$dir" > "$BUILD" 2>/dev/null || true

            used="$(grep -oE '\$\{[A-Z_][A-Z0-9_]*\}' "$BUILD" | tr -d '${}' | sort -u || true)"
            declared="$(
              { grep -oE '^\s+[A-Z_][A-Z0-9_]*:' "$VARS_FILE" | tr -d ' :'
                grep -oE '^[A-Z_][A-Z0-9_]*=' "$ENV_EXAMPLE" | tr -d '='
              } | sort -u
            )"

            undeclared="$(comm -23 <(printf '%s\n' "$used" | sed '/^$/d') <(printf '%s\n' "$declared" | sed '/^$/d') || true)"
            if [[ -n "$undeclared" ]]; then
              echo "FAIL: undeclared \${VAR} in $(basename $dir):"
              printf '    %s\n' $undeclared
              ERRORS=$((ERRORS+1))
            fi
            rm -f "$BUILD"
          done

          if [[ $ERRORS -gt 0 ]]; then
            exit 1
          fi
          echo "OK: all variables declared"

      - name: Verify prune policies
        run: |
          CLUSTER="${{ matrix.cluster }}"
          ERRORS=0

          # Check bootstrap CRs exist
          if [[ -d "overlay/clusters/$CLUSTER/bootstrap" ]]; then
            for f in gitrepository.yaml root-kustomization.yaml; do
              if [[ ! -f "overlay/clusters/$CLUSTER/bootstrap/$f" ]]; then
                echo "FAIL: bootstrap/$f not found"
                ERRORS=$((ERRORS+1))
              fi
            done
            if ! ls overlay/clusters/$CLUSTER/bootstrap/*-kustomization.yaml 1>/dev/null 2>&1; then
              echo "FAIL: No managed-cluster Kustomizations in bootstrap/"
              ERRORS=$((ERRORS+1))
            fi
          fi

          # Check prune policies in Kustomizations
          for f in overlay/clusters/$CLUSTER/mgmt/kustomization.yaml \
                   overlay/clusters/$CLUSTER/bootstrap/*-kustomization.yaml; do
            [[ -f "$f" ]] || continue
            PRUNE=$(grep -E '^\s+prune:' "$f" | head -1 | awk '{print $2}')
            if [[ "$f" == *"bootstrap/"* ]] && [[ "$PRUNE" == "true" ]]; then
              echo "WARN: prune: true on bootstrap Kustomization ($f)"
            fi
          done

          if [[ $ERRORS -gt 0 ]]; then
            exit 1
          fi
          echo "OK: prune policy check passed"

      - name: Check for committed secrets
        run: |
          SECRETS=$(git ls-files | grep -E '(secret|password|token|key)\.yaml$' | grep -v '\.example' || true)
          if [[ -n "$SECRETS" ]]; then
            echo "FAIL: Committed secret files:"
            echo "$SECRETS"
            exit 1
          fi
          echo "OK: no committed secrets"

      - name: Check YAML syntax
        run: |
          find . -name '*.yaml' -not -path './.git/*' -not -path './.github/*' -not -name '*.example' | while read -r f; do
            if ! python3 -c "import yaml; yaml.safe_load(open('$f'))" 2>/dev/null; then
              echo "FAIL: Invalid YAML: $f"
              exit 1
            fi
          done
          echo "OK: all YAML files valid"

      - name: Check directory structure
        run: |
          # Verify base/ has required directories
          for dir in base/versions base/appdeployments base/helm-releases base/custom-crds; do
            if [[ ! -d "$dir" ]]; then
              echo "FAIL: $dir not found"
              exit 1
            fi
          done
          echo "OK: base/ structure valid"

          # Verify overlay/clusters/reference/ exists
          if [[ ! -d "overlay/clusters/reference" ]]; then
            echo "FAIL: overlay/clusters/reference/ not found"
            exit 1
          fi
          echo "OK: reference cluster exists"

          # Verify mgmt/ or managed-*/ exists
          HAS_CLUSTER=false
          [[ -d "overlay/clusters/reference/mgmt" ]] && HAS_CLUSTER=true
          [[ -d "overlay/clusters/reference/managed-"* ]] && HAS_CLUSTER=true
          if [[ "$HAS_CLUSTER" == "false" ]]; then
            echo "FAIL: No mgmt/ or managed-*/ in overlay"
            exit 1
          fi
          echo "OK: multi-cluster structure valid"

          # Verify bootstrap/ exists
          if [[ -d "overlay/clusters/reference/mgmt" ]] || [[ -d "overlay/clusters/reference/managed-"* ]]; then
            if [[ ! -d "overlay/clusters/reference/bootstrap" ]]; then
              echo "FAIL: bootstrap/ not found (required for multi-cluster)"
              exit 1
            fi
          fi
          echo "OK: bootstrap/ exists"

      - name: Check required files
        run: |
          for f in PRACTICES.md CHANGELOG.md ntnx-nkp-tpl-gitops.md README.md; do
            if [[ ! -f "$f" ]]; then
              echo "FAIL: $f not found"
              exit 1
            fi
          done
          echo "OK: all required files present"
