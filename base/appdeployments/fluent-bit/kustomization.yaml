apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# fluent-bit AppDeployment — deploys the Fluent Bit log collector to NKP clusters.
# ConfigMap MUST be listed before the AppDeployment (Kommander retries until it exists).
resources:
  - configs/fluent-bit-override.yaml
  - fluent-bit.appdeployment.yaml
