apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# base = the SHARED, provider-agnostic resources only.
# The connector + its credential Secret are PROVIDER-SPECIFIC and are added by the overlay
# provider Component (providers/ad or providers/okta), so switching providers emits only that
# provider's objects.
resources:
  - virtual-group.yaml
  - clusterrolebinding.yaml

# generatorOptions:
#   disableNameSuffixHash: true
# No secretGenerator anywhere: a generated Secret base64-encodes its value, hiding ${VAR} from Flux
# postBuild. Secrets are plain Secret + stringData (see secrets/<name>/secret.yaml).
