# Grants cluster-admin to the IdP admin **group** (`oidc:<group>`). Cluster-scoped.
# The group name is set ONCE here (default `NKP-Admins`, the same for AD and Okta); change it to
# your IdP group. Override as a whole in the overlay only if a cluster needs a different group.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nkp-admins-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "oidc:NKP-Admins" # admin group (set to your IdP group)
