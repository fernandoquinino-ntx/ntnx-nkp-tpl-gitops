apiVersion: v1
kind: Secret
metadata:
  name: okta-client
  namespace: kommander
type: Opaque
# stringData (not kustomize secretGenerator) so ${VAR} stays visible to Flux postBuild
# substitution. The overlay replaces these values with ${OKTA_CLIENT_ID} and ${OKTA_CLIENT_SECRET}.
stringData:
  client-id: "PLACEHOLDER_CLIENT_ID"
  client-secret: "PLACEHOLDER_CLIENT_SECRET"
