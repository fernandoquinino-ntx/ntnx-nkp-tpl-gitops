# vault-operator HelmRelease — deploys the bank-vaults Vault operator.
# Chart version is injected via ${VAR} and overridden in the overlay.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-operator
  namespace: vault
spec:
  interval: 5m
  chart:
    spec:
      chart: vault-operator
      version: "${VAULT_OPERATOR_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: vault-operator
        namespace: vault
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  rollback:
    enabled: true
  values:
    # Vault operator configuration
    crds:
      create: true
    # RBAC
    rbac:
      create: true
    # Image
    image:
      repository: "${VAULT_OPERATOR_IMAGE_REPO}"
      tag: "${VAULT_OPERATOR_IMAGE_TAG}"
      pullPolicy: IfNotPresent
    # Resources
    resources:
      limits:
        cpu: "${VAULT_OPERATOR_CPU_LIMIT}"
        memory: "${VAULT_OPERATOR_MEMORY_LIMIT}"
      requests:
        cpu: "${VAULT_OPERATOR_CPU_REQUEST}"
        memory: "${VAULT_OPERATOR_MEMORY_REQUEST}"
