# vault-operator HelmRepository — source for the bank-vaults Helm charts.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vault-operator
  namespace: vault
spec:
  type: oci
  interval: 5m
  url: "${VAULT_HELM_REPO_URL}"           # e.g., oci://ghcr.io/bank-vaults/helm-charts
