apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# identity-access/dex — shared RBAC resources (VirtualGroup + ClusterRoleBinding).
# The Connector CR and credential Secrets are PROVIDER-SPECIFIC and are added by the
# overlay provider Component (providers/ad or providers/okta).
resources:
  - virtual-group.yaml
  - clusterrolebinding.yaml

# generatorOptions:
#   disableNameSuffixHash: true
# NO secretGenerator — use plain Secret + stringData so ${VAR} stays visible to Flux postBuild.
