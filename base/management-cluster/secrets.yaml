# Management cluster secrets — 5 credential secrets for management mode.
apiVersion: v1
kind: Secret
metadata:
  name: "${MGMT_CLUSTER_NAME}-pc-credentials"
  namespace: "${MGMT_CLUSTER_NAMESPACE}"
type: Opaque
stringData:
  username: "${PRISM_USERNAME}"
  password: "${PRISM_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: "${MGMT_CLUSTER_NAME}-pc-credentials-for-csi"
  namespace: "${MGMT_CLUSTER_NAMESPACE}"
type: Opaque
stringData:
  username: "${PRISM_USERNAME}"
  password: "${PRISM_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: "${MGMT_CLUSTER_NAME}-pc-credentials-for-konnector-agent"
  namespace: "${MGMT_CLUSTER_NAMESPACE}"
type: Opaque
stringData:
  username: "${PRISM_USERNAME}"
  password: "${PRISM_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: "global-nutanix-credentials"
  namespace: "capx-system"
type: Opaque
stringData:
  username: "${PRISM_USERNAME}"
  password: "${PRISM_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: "prism-central-metadata"
  namespace: "${MGMT_CLUSTER_NAMESPACE}"
type: Opaque
stringData:
  prismCentralUuid: "${PRISM_UUID}"
  endpoint: "${PRISM_ENDPOINT}"
