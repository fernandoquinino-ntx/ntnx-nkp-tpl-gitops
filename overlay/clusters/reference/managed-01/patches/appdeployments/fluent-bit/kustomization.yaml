# fluent-bit AppDeployment — managed-01 workload cluster overlay Component.
# Deploys to the managed-01 cluster via:
#   - namespace: kommander-default-workspace
#   - clusterConfigOverrides[].clusterSelector targeting "managed-01"
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ../../../../../../../base/appdeployments/fluent-bit
patches:
  - path: appdeployment-patch.yaml
    target: { group: apps.kommander.d2iq.io, version: v1alpha3, kind: AppDeployment, name: fluent-bit }
  - path: config-patch.yaml
    target: { version: v1, kind: ConfigMap, name: fluent-bit-override }
