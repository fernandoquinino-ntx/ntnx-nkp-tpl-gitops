# Provider Component — Okta (oidc).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ../../../../../../../../../base/custom-crds/identity-access/dex/connectors/okta
  - ../../../../../../../../../base/custom-crds/identity-access/dex/secrets/okta-client
patches:
  - path: connector.yaml
    target: { group: dex.mesosphere.io, version: v1alpha1, kind: Connector, name: okta }
  - path: secret-patch.yaml
    target: { version: v1, kind: Secret, name: okta-client }
  - path: vg-patch.yaml
    target: { group: kommander.mesosphere.io, version: v1beta1, kind: VirtualGroup, name: admins }
  - path: crb-patch.yaml
    target: { group: rbac.authorization.k8s.io, version: v1, kind: ClusterRoleBinding, name: nkp-admins-cluster-admin }
