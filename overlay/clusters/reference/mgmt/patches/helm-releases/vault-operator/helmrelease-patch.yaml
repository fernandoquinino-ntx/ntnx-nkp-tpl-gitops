# RFC 6902 JSON patches — pin cluster-specific values onto the vault-operator HelmRelease.
- op: replace
  path: /spec/chart/spec/version
  value: "${VAULT_OPERATOR_CHART_VERSION}"

- op: replace
  path: /spec/values/image/repository
  value: "${VAULT_OPERATOR_IMAGE_REPO}"

- op: replace
  path: /spec/values/image/tag
  value: "${VAULT_OPERATOR_IMAGE_TAG}"

- op: replace
  path: /spec/values/resources/limits/cpu
  value: "${VAULT_OPERATOR_CPU_LIMIT}"

- op: replace
  path: /spec/values/resources/limits/memory
  value: "${VAULT_OPERATOR_MEMORY_LIMIT}"

- op: replace
  path: /spec/values/resources/requests/cpu
  value: "${VAULT_OPERATOR_CPU_REQUEST}"

- op: replace
  path: /spec/values/resources/requests/memory
  value: "${VAULT_OPERATOR_MEMORY_REQUEST}"
