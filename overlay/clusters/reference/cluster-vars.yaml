# cluster-vars — non-secret ${VAR} values for this cluster.
# Consumed by Flux `postBuild.substituteFrom` (flux-system/01-cluster-apps.yaml).
# Namespace MUST equal the Flux Kustomization namespace (`kommander-flux`).
# Secrets (passwords) belong in a Secret named `cluster-secrets`, never here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: kommander-flux
data:
  # --- AppDeployment: fluent-bit ---
  FLUENT_BIT_APP_REF: "fluent-bit-0.57.2"
  FLUENT_BIT_IMAGE_TAG: "3.1.6"
  FLUENT_BIT_CPU_LIMIT: "500m"
  FLUENT_BIT_MEMORY_LIMIT: "512Mi"
  FLUENT_BIT_CPU_REQUEST: "100m"
  FLUENT_BIT_MEMORY_REQUEST: "128Mi"
  LOKI_URL: "http://loki-gateway.loki.svc.cluster.local:3100"
  LOKI_TENANT_ID: "1"
  MGMT_CLUSTER_NAME: "mgmt-a"
  WORKLOAD_CLUSTER_NAME: "managed-01"

  # --- HelmRelease: vault-operator ---
  VAULT_HELM_REPO_URL: "oci://ghcr.io/bank-vaults/helm-charts"
  VAULT_OPERATOR_CHART_VERSION: "1.24.1"
  VAULT_OPERATOR_IMAGE_REPO: "cr.banzaicloud.com/bank-vaults/vault-operator"
  VAULT_OPERATOR_IMAGE_TAG: "1.24.1"
  VAULT_OPERATOR_CPU_LIMIT: "250m"
  VAULT_OPERATOR_MEMORY_LIMIT: "256Mi"
  VAULT_OPERATOR_CPU_REQUEST: "100m"
  VAULT_OPERATOR_MEMORY_REQUEST: "128Mi"

  # --- Custom CRD: identity-access/dex ---
  DEX_DISPLAY_NAME: "Example AD"
  DEX_LDAP_HOST: "dc01.ad.example.local:636"
  DEX_LDAP_BIND_DN: "CN=svc-nkp,CN=Users,DC=ad,DC=example,DC=local"
  DEX_LDAP_USER_BASE_DN: "DC=ad,DC=example,DC=local"
  DEX_LDAP_GROUP_BASE_DN: "DC=ad,DC=example,DC=local"
  DEX_LDAP_INSECURE_SKIP_VERIFY: "true"
  DEX_LDAP_ROOT_CA_SECRET: "ad-root-ca"
  DEX_ADMIN_GROUP: "NKP-Admins"
  # --- Okta (OIDC) alternative ---
  OKTA_ISSUER: "https://example.okta.com/oauth2/default"
  OKTA_REDIRECT_URI: "https://kommander.example.com/dex/callback"
  OKTA_CLIENT_SECRET_NAME: "okta-client"
  OKTA_CLIENT_ID: "0oaXXXXXXXXXXXXXXXX"
