# RFC 6902 JSON patch — pin Okta/OIDC values onto Connector/okta.
- op: replace
  path: /spec/displayName
  value: "${DEX_DISPLAY_NAME}"

- op: replace
  path: /spec/oidc/issuer
  value: "${OKTA_ISSUER}"

- op: replace
  path: /spec/oidc/redirectURI
  value: "${OKTA_REDIRECT_URI}"

- op: replace
  path: /spec/oidc/clientSecretRef/name
  value: "${OKTA_CLIENT_SECRET_NAME}"
