# RFC 6902 — pin the CLUSTER-SPECIFIC Okta values onto Connector/okta (base template).
# Standard values (type, scopes, insecureEnableGroups, insecureSkipEmailVerified,
# userIDKey: sub, userNameKey: email) live in the BASE template — do not repeat them here.
- op: replace
  path: /spec/oidc/issuer
  value: "https://<org>.okta.com/oauth2/default" # your Okta AS issuer
- op: replace
  path: /spec/oidc/redirectURI
  value: "https://mgmt-a.ntnxlab.local/dex/callback" # <kommander-host>/dex/callback
- op: replace
  path: /spec/oidc/clientSecretRef/name
  value: "okta-client" # Secret in `kommander` (keys client-id, client-secret)
