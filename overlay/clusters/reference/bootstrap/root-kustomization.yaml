# Flux Kustomization — syncs management cluster Day-2 apps to the management cluster.
# Applied to the management cluster's kommander namespace.
# prune: false — NEVER cascade-delete Kommander platform objects.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mgmt-platform
  namespace: kommander
spec:
  interval: 5m
  prune: false                         # Platform objects — never auto-delete
  validation: client
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: ntnx-nkp-tpl-gitops
    namespace: kommander-flux
  path: ./overlay/clusters/reference/mgmt
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
      - kind: Secret
        name: cluster-secrets
        optional: true
  dependsOn:
    - name: ntnx-nkp-tpl-gitops
