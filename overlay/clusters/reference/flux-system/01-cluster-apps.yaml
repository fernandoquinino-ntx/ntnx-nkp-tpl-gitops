# Flux Kustomization — deploys all apps for the `reference` cluster.
# Syncs ./overlay/clusters/reference/cluster-apps and applies ${VAR} substitution AFTER the
# kustomize build (Flux postBuild).
#
# PRUNE POLICY: prune: true — safe for app resources (AppDeployments, HelmReleases).
# For platform-only repos (License, Connectors), use prune: false.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: kommander-flux
spec:
  interval: 5m
  prune: true                          # Safe for app resources — Flux can delete/recreate
  validation: client                     # Client-side validation only (no server-side)
  wait: true                           # Wait for resources to be ready
  timeout: 5m                          # Max time to wait for readiness
  sourceRef:
    kind: GitRepository
    name: ntnx-nkp-tpl-repo
    namespace: kommander-flux
  path: ./overlay/clusters/reference/cluster-apps
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
      - kind: Secret
        name: cluster-secrets           # holds passwords, API keys, client secrets
        optional: true
  # Depends on the GitRepository being ready before this Kustomization starts
  dependsOn:
    - name: ntnx-nkp-tpl-repo
      namespace: kommander-flux
